[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI
build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=17
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_MISO=19
    -DTFT_BL=32
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=20000000

[env:native]
platform = native
test_build_src = no
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
